name: Historical ST Backfill V3 (Encrypted)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/st-backfill-v3.yml"

permissions:
  contents: write

concurrency:
  group: mrs-historical-st-backfill-v3
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MRS_DATA_PASSPHRASE: ${{ secrets.MRS_DATA_PASSPHRASE }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "LIBF MRS Research Bot"
          git config user.email "mrs-research-bot@users.noreply.github.com"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BaoStock
        run: python -m pip install --disable-pip-version-check baostock==0.9.3

      - name: Run frozen 2014-2023 ST remediation
        run: python tools/st_backfill_orchestrator.py
